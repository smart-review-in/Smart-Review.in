<script>
const params = new URLSearchParams(window.location.search);
const bizId = params.get("biz");

let activeConfig = null;
let googleReviewUrl = "";
let currentRating = 0;
let activeTags = new Set();
const recentMemory = new Map();

// UI Elements
const bizTitle = document.getElementById("bizName");
const starContainer = document.getElementById("starContainer");
const ratingLabel = document.getElementById("ratingLabel");
const flowSection = document.getElementById("flowSection");
const tagSectionTitle = document.getElementById("tagSectionTitle");
const tagsContainer = document.getElementById("tagsContainer");
const reviewOutput = document.getElementById("reviewOutput");
const actionBtn = document.getElementById("actionBtn");
const regenerateBtn = document.getElementById("regenerateBtn");
const toastMsg = document.getElementById("toastMsg");

// 1. Fetch secure config from Edge API
async function init() {
  if (!bizId) {
    showAccessDenied("No business identifier provided.");
    return;
  }

  try {
    const res = await fetch(`/api/get-config?biz=${encodeURIComponent(bizId)}`);
    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.error || "Access Denied");
    }

    activeConfig = await res.json();
    
    // Set Business Details
    bizTitle.textContent = activeConfig.business.name;
    googleReviewUrl = `https://search.google.com/local/writereview?placeid=${encodeURIComponent(activeConfig.business.placeId)}`;
    
    bindEventListeners();
  } catch (err) {
    showAccessDenied(err.message);
  }
}

function showAccessDenied(message) {
  document.querySelector(".container").innerHTML = `
    <div class="card" style="text-align: center; padding: 40px 20px;">
      <h2 style="color: #ef4444; margin-bottom: 8px;">Portal Unavailable</h2>
      <p style="color: var(--text-muted); font-size: 14px;">${message}</p>
    </div>
  `;
}

function bindEventListeners() {
  const ratingLabels = {
    1: "Very poor experience ★☆☆☆☆",
    2: "Below expectations ★★☆☆☆",
    3: "Average experience ★★★☆☆",
    4: "Great experience ★★★★☆",
    5: "Excellent experience ★★★★★"
  };

  starContainer.addEventListener("click", (e) => {
    if (!e.target.classList.contains("star")) return;

    currentRating = Number(e.target.dataset.val);
    [...starContainer.children].forEach(star => {
      star.classList.toggle("active", Number(star.dataset.val) <= currentRating);
    });

    ratingLabel.textContent = ratingLabels[currentRating];
    flowSection.style.display = "flex";
    tagSectionTitle.textContent = currentRating >= 4 ? "Select Highlights" : "What could be improved?";

    activeTags.clear();
    renderTags();
    generateDraft();
  });

  regenerateBtn.addEventListener("click", () => {
    generateDraft();
    reviewOutput.style.opacity = "0.5";
    setTimeout(() => { reviewOutput.style.opacity = "1"; }, 100);
  });

  actionBtn.addEventListener("click", async () => {
    const text = reviewOutput.textContent.trim();
    if (!text) return;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      }
      toastMsg.textContent = "✓ Copied to clipboard! Opening Google...";
    } catch {
      toastMsg.textContent = "Opening Google Reviews...";
    }

    setTimeout(() => { window.location.href = googleReviewUrl; }, 750);
  });
}

function renderTags() {
  tagsContainer.innerHTML = "";
  activeConfig.tags.forEach(tag => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tag";
    btn.textContent = tag;

    btn.addEventListener("click", () => {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        btn.classList.remove("active");
      } else {
        activeTags.add(tag);
        btn.classList.add("active");
      }
      generateDraft();
    });
    tagsContainer.appendChild(btn);
  });
}

function getUniqueRandom(pool, key) {
  if (!pool || pool.length === 0) return "";
  if (pool.length === 1) return pool[0];
  const lastIndex = recentMemory.get(key);
  let newIndex;
  let attempts = 0;
  do {
    newIndex = Math.floor(Math.random() * pool.length);
    attempts++;
  } while (newIndex === lastIndex && attempts < 10);
  recentMemory.set(key, newIndex);
  return pool[newIndex];
}

function generateDraft() {
  if (!currentRating) return;
  const ratingPhrases = activeConfig.phrases[currentRating] || {};
  
  let selected = [...activeTags]
    .filter(t => ratingPhrases[t] && ratingPhrases[t].length > 0)
    .map(t => getUniqueRandom(ratingPhrases[t], `${t}_${currentRating}`));

  let text = "";
  if (selected.length === 0) {
    text = `Had a ${currentRating >= 4 ? 'great' : 'notable'} experience at ${activeConfig.business.name}. Service and overall quality were handled accordingly.`;
  } else if (selected.length === 1) {
    text = `Visited ${activeConfig.business.name}. ${selected[0]}.`;
  } else {
    text = `Visited ${activeConfig.business.name}. ${selected.slice(0, -1).join(", ")}, and ${selected[selected.length - 1].toLowerCase()}.`;
  }

  reviewOutput.textContent = text;
}

init();
</script>
