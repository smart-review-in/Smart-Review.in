<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave a Review</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #171a21;
    --text: #f4f4f5;
    --text-muted: #9ca3af;
    --accent: #22c55e;
    --star-inactive: #3f3f46;
    --star-active: #facc15;
    --tag-bg: #1f2330;
    --tag-active-bg: #22c55e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  /* Powered By Header Branding */
  .powered-by {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .powered-by span {
    color: var(--accent);
    font-weight: 700;
  }

  #bizName {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 24px;
  }

  #starContainer {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .star {
    font-size: 36px;
    line-height: 1;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--star-inactive);
    transition: color 0.15s ease, transform 0.1s ease;
    padding: 0;
  }

  .star:hover { transform: scale(1.1); }
  .star.active { color: var(--star-active); }

  #ratingLabel {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    min-height: 18px;
    margin-bottom: 8px;
  }

  #flowSection {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-top: 16px;
  }

  /* Spacing added below Select Highlights title */
  #tagSectionTitle {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 12px;
  }

  #tagsContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--star-inactive);
    background: var(--tag-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .tag.active {
    background: var(--tag-active-bg);
    border-color: var(--tag-active-bg);
    color: #06210f;
    font-weight: 600;
  }

  #reviewOutput {
    background: var(--tag-bg);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.5;
    min-height: 60px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
  }

  button.primary,
  button.secondary {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button.primary {
    background: var(--accent);
    color: #06210f;
  }

  button.secondary {
    background: transparent;
    border: 1px solid var(--star-inactive);
    color: var(--text);
  }

  #toastMsg {
    text-align: center;
    font-size: 13px;
    color: var(--accent);
    min-height: 18px;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <!-- Added Powered by branding -->
    <div class="powered-by">Powered by <span>smart-review.in</span></div>
    
    <h1 id="bizName">Loading…</h1>
    <p class="subtitle">Tap a star to get started</p>

    <div id="starContainer">
      <button type="button" class="star" data-val="1">★</button>
      <button type="button" class="star" data-val="2">★</button>
      <button type="button" class="star" data-val="3">★</button>
      <button type="button" class="star" data-val="4">★</button>
      <button type="button" class="star" data-val="5">★</button>
    </div>
    <p id="ratingLabel"></p>

    <div id="flowSection">
      <div>
        <p id="tagSectionTitle"></p>
        <div id="tagsContainer"></div>
      </div>

      <div id="reviewOutput"></div>

      <div class="btn-row">
        <button type="button" id="regenerateBtn" class="secondary">Regenerate</button>
        <button type="button" id="actionBtn" class="primary">Copy &amp; Post Review</button>
      </div>

      <p id="toastMsg"></p>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const bizId = params.get("biz");

let activeConfig = null;
let googleReviewUrl = "";
let currentRating = 0;
let activeTags = new Set();
const recentMemory = new Map();

// UI Elements
const bizTitle = document.getElementById("bizName");
const starContainer = document.getElementById("starContainer");
const ratingLabel = document.getElementById("ratingLabel");
const flowSection = document.getElementById("flowSection");
const tagSectionTitle = document.getElementById("tagSectionTitle");
const tagsContainer = document.getElementById("tagsContainer");
const reviewOutput = document.getElementById("reviewOutput");
const actionBtn = document.getElementById("actionBtn");
const regenerateBtn = document.getElementById("regenerateBtn");
const toastMsg = document.getElementById("toastMsg");

// 1. Fetch secure config from Edge API
async function init() {
  if (!bizId) {
    showAccessDenied("No business identifier provided.");
    return;
  }

  try {
    const res = await fetch(`/api/get-config?biz=${encodeURIComponent(bizId)}`);
    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.error || "Access Denied");
    }

    activeConfig = await res.json();

    // Set Business Details
    bizTitle.textContent = activeConfig.business.name;
    googleReviewUrl = `https://search.google.com/local/writereview?placeid=${encodeURIComponent(activeConfig.business.placeId)}`;

    bindEventListeners();
  } catch (err) {
    showAccessDenied(err.message);
  }
}

function showAccessDenied(message) {
  const container = document.querySelector(".container");
  container.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";
  card.style.textAlign = "center";
  card.style.padding = "40px 20px";

  const heading = document.createElement("h2");
  heading.style.color = "#ef4444";
  heading.style.marginBottom = "8px";
  heading.textContent = "Portal Unavailable";

  const msg = document.createElement("p");
  msg.style.color = "var(--text-muted)";
  msg.style.fontSize = "14px";
  msg.textContent = message;

  card.appendChild(heading);
  card.appendChild(msg);
  container.appendChild(card);
}

function bindEventListeners() {
  const ratingLabels = {
    1: "Very poor experience ★☆☆☆☆",
    2: "Below expectations ★★☆☆☆",
    3: "Average experience ★★★☆☆",
    4: "Great experience ★★★★☆",
    5: "Excellent experience ★★★★★"
  };

  starContainer.addEventListener("click", (e) => {
    if (!e.target.classList.contains("star")) return;

    currentRating = Number(e.target.dataset.val);
    [...starContainer.children].forEach(star => {
      star.classList.toggle("active", Number(star.dataset.val) <= currentRating);
    });

    ratingLabel.textContent = ratingLabels[currentRating];
    flowSection.style.display = "flex";
    tagSectionTitle.textContent = currentRating >= 4 ? "Select Highlights" : "What could be improved?";

    activeTags.clear();
    renderTags();
    generateDraft();
  });

  regenerateBtn.addEventListener("click", () => {
    generateDraft();
    reviewOutput.style.opacity = "0.5";
    setTimeout(() => { reviewOutput.style.opacity = "1"; }, 100);
  });

  actionBtn.addEventListener("click", async () => {
    const text = reviewOutput.textContent.trim();
    if (!text) return;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      }
      toastMsg.textContent = "✓ Copied to clipboard! Opening Google...";
    } catch {
      toastMsg.textContent = "Opening Google Reviews...";
    }

    setTimeout(() => { window.location.href = googleReviewUrl; }, 750);
  });
}

function renderTags() {
  tagsContainer.innerHTML = "";
  activeConfig.tags.forEach(tag => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tag";
    btn.textContent = tag;

    btn.addEventListener("click", () => {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        btn.classList.remove("active");
      } else {
        activeTags.add(tag);
        btn.classList.add("active");
      }
      generateDraft();
    });
    tagsContainer.appendChild(btn);
  });
}

function getUniqueRandom(pool, key) {
  if (!pool || pool.length === 0) return "";
  if (pool.length === 1) return pool[0];
  const lastIndex = recentMemory.get(key);
  let newIndex;
  let attempts = 0;
  do {
    newIndex = Math.floor(Math.random() * pool.length);
    attempts++;
  } while (newIndex === lastIndex && attempts < 10);
  recentMemory.set(key, newIndex);
  return pool[newIndex];
}

function generateDraft() {
  if (!currentRating) return;
  const ratingPhrases = activeConfig.phrases[currentRating] || {};

  let selected = [...activeTags]
    .filter(t => ratingPhrases[t] && ratingPhrases[t].length > 0)
    .map(t => getUniqueRandom(ratingPhrases[t], `${t}_${currentRating}`));

  let text = "";
  if (selected.length === 0) {
    text = `Had a ${currentRating >= 4 ? 'great' : 'notable'} experience at ${activeConfig.business.name}. Service and overall quality were handled accordingly.`;
  } else if (selected.length === 1) {
    text = `Visited ${activeConfig.business.name}. ${selected[0]}.`;
  } else {
    text = `Visited ${activeConfig.business.name}. ${selected.slice(0, -1).join(", ")}, and ${selected[selected.length - 1].toLowerCase()}.`;
  }

  reviewOutput.textContent = text;
}

init();
</script>
</body>
</html>
